services:
  personal-mcp:
    build: ./app
    container_name: personal-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8765:8765"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
